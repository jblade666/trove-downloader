[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trove-downloader"
version = "0.1.0"
description = "Download and sync files from public file-share links to local or SFTP destinations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "certifi",
    "cryptography>=42",
    "paramiko>=3.4",
    "keyring>=24",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
kregfile = ["python-socketio[client]>=5.11"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
trove = "trove.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
